<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rs — a self-hosted personal finance tracker for rupee budgets"
    />
    <meta name="theme-color" content="#0f172a" />
    <title>Rs — Personal finance</title>
    <script>
      // Applied before first paint so a dark-mode user never sees a white flash.
      (() => {
        const saved = localStorage.getItem('rs.theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved ?? (prefersDark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
